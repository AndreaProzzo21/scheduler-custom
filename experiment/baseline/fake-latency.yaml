apiVersion: v1
kind: Pod
metadata:
  name: latency-injector-w1
  namespace: default
spec:
  nodeName: talos-tim-worker-1 
  hostNetwork: true 
  containers:
  - name: tc-injector
    image: alpine:latest
    securityContext:
      privileged: true 
    command: ["/bin/sh", "-c"]
    args:
      - >
        apk add --no-cache iproute2 &&
        tc qdisc del dev ens18 root 2>/dev/null || true &&
        echo "Aggiungo 4ms (+/- 1ms di JITTER) su ens18 (Worker 1)..." &&
        tc qdisc add dev ens18 root netem delay 3ms 1ms distribution normal &&
        trap 'tc qdisc del dev ens18 root; exit 0' SIGTERM;
        while true; do sleep 1; done
---
